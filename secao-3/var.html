<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tag var</title>
</head>
<body>

        <!-- A tag var é usada para definir uma variável em um contexto de programação ou matemática -->
        <!-- Atributos: -->
        <!--
            Global attributes: class, id, style, title, etc.
            Non-standard attributes: data-*, aria-*
        -->
        <p>Exemplo de uso da tag var:</p>
        <p>Na fórmula <var>a</var> + <var>b</var> = <var>c</var>, as letras representam variáveis.</p>
        <p>Neste exemplo, a tag <code>&lt;var&gt;</code> é usada para indicar que as letras "a", "b" e "c" são variáveis em uma expressão matemática.</p>
    
</body>
</html>
