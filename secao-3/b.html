<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>tag b</title>
</head>
<body>

    <!-- A tag b é usada para deixar o texto em negrito sem dar ênfase ao conteúdo -->
    <!-- A tag b é usada para destacar palavras ou frases importantes sem alterar o significado do texto  nao tem peso semântico -->
    <!-- Antes de usar a tag b, considere usar a tag <strong>, <mark>, <em> ou <h1> até <h6> para destacar o texto -->
    <!-- Atributos: -->
    <!--
        Global attributes: class, id, style, title, etc.
        Non-standard attributes: data-*, aria-*
    -->

    <p>Este é um texto normal e este é um texto em <b>negrito</b> usando a tag b.</p>
    <p>Você pode usar a tag <b>b</b> para destacar palavras ou frases importantes sem alterar o significado do texto.</p>
    <p>Exemplo de uso da tag <b>b</b> em uma frase: A palavra <b>importante</b> está em negrito.</p>
    
</body>
</html>
