<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TAg li</title>
</head>
<body>

    <!-- Tag li usada para criar itens de listas -->
     <!-- Atributos: -->
    <!--
        Global attributes: class, id, style, title, etc.
        Non-standard attributes: data-*, aria-*

        em lista ordenada (ol):
            value: Define o valor do item na lista ordenada
    -->

    <h2>Exemplo de lista nao ordenada</h2>
    <ul>
        <li>Item 1</li>
        <li>Item 2
            <ul>
                <li>Subitem 2.1</li>
                <li>Subitem 2.2</li>
                <li>Subitem 2.3</li>
            </ul>
        </li>
        <li>Item 3</li>
    </ul>

    <h2>Exemplo de lista ordenada com valores personalizados</h2>
    <ol>
        <li value="10">Item 10</li>
        <li value="20">Item 20</li>
        <li value="30">Item 30</li>
        <li>Item 31</li>
        <li>Item 32</li>
    </ol>
    
</body>
</html>
