<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tag area</title>
</head>
<body>

    <!--
        A tag area é usada para criar areas clicáveis em uma imagem
        Atributos:
        shape: Define o shape da area
        coords: Define as coordenadas da area
        href: Define o link da area
        alt: Define o texto alternativo da area
    -->

    <!-- Atributos do shape: circle, rect, poly, default: rect -->

    <!-- 
    
    <img src="/img/logo1.png" alt="Logo do site" usemap="#mapa-logo">
    <map name="mapa-logo">
        <area shape="circle" coords="211,263,15" href="https://www.hcode.com" alt="Olho esquerdo">
        <area shape="circle" coords="301,263,15" href="https://www.hcode.com" alt="Olho direito">
    </map>

    <img src="/img/logo1.png" alt="Logo do site" usemap="#mapa-logo2">
    <map name="mapa-logo2"> 
        <area shape="rect" coords="180,250,240,280" href="https://www.hcode.com" alt="Olho esquerdo">
        <area shape="rect" coords="270,250,330,280" href="https://www.hcode.com" alt="Olho direito">
    </map>
    -->

    <img src="/img/logo1.png" alt="Logo do site" usemap="#mapa-logo3">
    <map name="mapa-logo3">
        <area shape="poly" coords="60,197, 103,168, 153,192, 111,236, 97,289, 52,248" href="https://www.hcode.com" alt="Orelha esquerda" title="orelha esquerda">
    </map>
    
</body>
</html>
