<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tag strong</title>
</head>
<body>

    <!-- A tag strong é usada para indicar que o texto contido nela tem uma importância forte ou ênfase especial. -->

    <!-- Atributos: -->
    <!--
        Global attributes: class, id, style, title, etc.
        Non-standard attributes: data-*, aria-*
    -->

    <p>Exemplo de uso da tag strong:</p>
    <p>Este é um texto com <strong>forte ênfase</strong> para destacar sua importância.</p>
    <p>Neste exemplo, o texto dentro da tag <code>&lt;strong&gt;</code> geralmente aparece em negrito, indicando que ele deve ser destacado em relação ao restante do conteúdo.</p>
    
</body>
</html>
