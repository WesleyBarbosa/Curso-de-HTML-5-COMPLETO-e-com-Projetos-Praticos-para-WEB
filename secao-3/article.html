<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>tag article</title>
</head>
<body>

    <!-- Sobre a TAG ARTICLE -->
    <!-- 
        A tag article define um conteúdo independente e autocontido dentro de um documento HTML.
        Pode ser usada para representar artigos de blog, notícias, postagens de fórum, entre outros.
        Exemplo:
        <article>
            <h2>Título do Artigo</h2>
            <p>Conteúdo do artigo...</p>
        </article> 
     -->
    <header>
        <h1>Bem-vindo ao Meu Blog</h1>
    </header>

    <article>
        <h2>Primeiro Artigo</h2>
        <p>Este é o conteúdo do meu primeiro artigo. Aqui eu compartilho informações interessantes sobre diversos tópicos.</p>
    </article>

    <article>
        <h2>Segundo Artigo</h2>
        <p>Este é o conteúdo do meu segundo artigo. Continuo explorando novos temas e ideias para meus leitores.</p>
    </article>
    
</body>
</html>
