<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>tag caption</title>
</head>
<body>

    <!-- Atributos -->
    <!--
     tag usada para definir uma legenda para a tabela.
     Pode ser posicionada no topo ou na parte inferior da tabela usando o atributo "align".
    - align: Define o alinhamento da legenda (top, bottom). 
    - O atributo align foi removido no HTML5, mas ainda é suportado por navegadores para compatibilidade com versões anteriores.
    - Exemplo:
    <caption align="top">Legenda da tabela</caption> 
    -->

    <table border="1">
        <caption align="top">Países da América do Sul</caption>
        <thead>
            <tr>
                <th>País</th>
                <th>Capital</th>
                <th>População</th>
            </tr>
        </thead>
        <tbody>
            <tr>
                <td>Brasil</td>
                <td>Brasília</td>
                <td>211 milhões</td>
            </tr>
            <tr>
                <td>Argentina</td>
                <td>Buenos Aires</td>
                <td>45 milhões</td>
            </tr>
            <tr>
                <td>Chile</td>
                <td>Santiago</td>
                <td>19 milhões</td>
            </tr>
        </tbody>
    </table>
    
</body>
</html>
