<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tag samp</title>
</head>
<body>
        <!-- A tag samp é usada para definir texto que representa a saída de um programa de computador -->
        <!-- Atributos: -->
        <!--
            Global attributes: class, id, style, title, etc.
            Non-standard attributes: data-*, aria-*
        -->
        <p>Exemplo de uso da tag samp:</p>
        <p>O resultado do comando foi: <samp>Erro: Arquivo não encontrado</samp></p>
        <p>Neste exemplo, a tag <code>&lt;samp&gt;</code> é usada para indicar que o texto "Erro: Arquivo não encontrado" é uma saída gerada por um programa de computador.</p>

    
</body>
</html>
