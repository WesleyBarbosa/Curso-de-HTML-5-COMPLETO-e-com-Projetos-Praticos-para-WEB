<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>tag a</title>
</head>
<body>

    <!--
    Atributos:
    href: Especifica o endereço do documento para onde o link aponta.
    target: Define como o documento será aberto (ex: _blank, _self, _parent, _top).
    title: Define o título do link.
    rel: Define a relação entre o documento atual e o documento referenciado.
    download: Define o nome do arquivo para download.
    -->

    <a href="https://www.exemplo.com" target="_blank" title="Exemplo de link">Clique aqui</a><br><br>
    <a href="download.pdf" download="download.pdf">Baixar PDF</a><br><br>
    <a href="#secao2" title="Ir para a seção 2">Ir para a seção 2</a><br><br>
    <a href="https://www.exemplo.com" rel="noopener noreferrer" target="_blank">Link seguro</a><br><br>
    <a href="mailto:wesley.barbosa2015@gmail.com">Enviar e-mail</a>

</body>
</html>
