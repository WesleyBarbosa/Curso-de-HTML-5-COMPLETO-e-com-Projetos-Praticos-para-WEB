<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>tag section</title>
</head>
<body>

    <!-- Tag section usada para agrupar conteúdo semânticamente para uma seção especifica -->

    <!-- Atributos: -->
    <!--
        Global attributes: class, id, style, title, etc.
        Non-standard attributes: data-*, aria-*
    -->

    <section id="introducao">
        <h2>Introdução</h2>
        <p>Esta seção apresenta uma introdução ao tema principal do documento.</p>
    </section>
    
</body>
</html>
