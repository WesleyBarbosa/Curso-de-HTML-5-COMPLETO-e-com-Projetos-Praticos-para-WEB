<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tag summary</title>
</head>
<body>

    <!-- Tag summary usada para exibir um resumo de um elemento -->

    <!-- Atributos: -->
    <!--
        Global attributes: class, id, style, title, etc.
        Non-standard attributes: data-*, aria-*
    -->

    <details id="detalhes">
        <summary>Detalhes</summary>
        <p>Este conteúdo é exibido apenas quando o usuário clica no resumo.</p>
    </details>
    <hr/>
    <details open id="detalhes">
        <summary>Detalhes</summary>
        <p>Este conteúdo é exibido por padrão.</p>
    </details>
    
</body>
</html>
