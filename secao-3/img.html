<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sobre a tag img</title>
</head>
<body>
    <!--
    Atributos:
    src: Especifica o caminho da imagem.
    alt: Texto alternativo que descreve a imagem.
    width: Define a largura da imagem.
    height: Define a altura da imagem.
    title: Fornece informações adicionais sobre a imagem.
    -->

    <h1>Exemplos da tag img</h1>

    <img src="https://wiiprint.com.br/wp-content/uploads/2024/01/HTML-5-007-WSTK-HTML-5-001.jpeg/" alt="Imagem de exemplo" width="150" height="150" title="Imagem Placeholder"><br><br>

    <img src="https://wiiprint.com.br/wp-content/uploads/2024/01/HTML-5-007-WSTK-HTML-5-001.jpeg/300x100" alt="Outra imagem de exemplo" width="300" height="100" title="Imagem Placeholder 300x100"><br><br>

    <img src="https://via.placeholder.com/600x200" alt="Mais uma imagem de exemplo" width="600" height="200" title="Imagem Placeholder 600x200"><br>

    <img src="/img/logo.png" alt="Logo do site"><br><br>
    <img src="../img/logo.png" alt="Logo do site">
    <br>
</body>
</html>
