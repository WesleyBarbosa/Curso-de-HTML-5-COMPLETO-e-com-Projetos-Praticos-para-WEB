<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sobre a tag img</title>
</head>
<body>
    <!--
    Atributos:
    src: Especifica o caminho da imagem.
    alt: Texto alternativo que descreve a imagem.
    width: Define a largura da imagem.
    height: Define a altura da imagem.
    title: Fornece informações adicionais sobre a imagem.
    -->

    <h1>Exemplo de uso da tag img</h1>
    <img src="https://images.icon-icons.com/171/PNG/512/html5_23329.png" alt="Logo do HTML5" width="200" height="200" title="Logo do HTML5">
    <br><br>
    <img src="../img/face.png" alt="Logo do Facebook" width="200" height="200" title="Logo do Facebook">

    <a href="https://www.hcode.com.br" target="_blank"><img src="../img/logo.png" alt="Logo do site" width="200" height="200" title="Logo do site"></a>


</body>
</html>
