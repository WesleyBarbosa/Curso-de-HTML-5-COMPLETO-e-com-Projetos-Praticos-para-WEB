<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>tag iframe</title>
</head>
<body>

    <!--
    Atributos:
    src: Especifica o endereço do documento a ser carregado dentro do iframe.
    width: Define a largura do iframe.
    height: Define a altura do iframe.
    name: Define o nome do iframe.
    title: Define o título do iframe.
    sandbox: Aplica restrições de segurança ao conteúdo do iframe.
    allow: Especifica permissões para o conteúdo do iframe.
    -->

    <iframe src="embed.html" width="600" height="400" name="iframe1" title="Exemplo de iframe">
        Seu navegador não suporta a tag iframe.
    </iframe>

</body>
</html>
