<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>tag tfoot</title>
</head>
<body>

    <table>
        <thead>
            <tr>
                <th>Item</th>
                <th>Valor Unitário</th>
                <th>Quantidade</th>
            </tr>
        </thead>
        <tbody>
            <tr>
                <td>Caderno</td>
                <td>R$ 10,00</td>
                <td>3</td>
            </tr>
            <tr>
                <td>Caneta</td>
                <td>R$ 2,00</td>
                <td>5</td>
            </tr>
        </tbody>
        <tfoot>
            <tr>
                <td colspan="2">Total</td>
                <td>R$ 40,00</td>
            </tr>
        </tfoot>
    </table>
    
</body>
</html>
