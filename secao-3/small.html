<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tag small</title>
</head>
<body>

    <!-- A tag small é usada para indicar que o texto contido nela é de menor importância ou relevância em relação ao texto ao redor. -->

    <!-- Atributos: -->
    <!--
        Global attributes: class, id, style, title, etc.
        Non-standard attributes: data-*, aria-*
    -->

    <p>Exemplo de uso da tag small:</p>
    <p>Este é um texto normal e este é um texto <small>menor</small> para indicar menor importância.</p>
    <p>Neste exemplo, o texto dentro da tag <code>&lt;small&gt;</code> aparece com uma fonte menor, sugerindo que ele é menos relevante em comparação com o texto ao redor.</p>
    
</body>
</html>
