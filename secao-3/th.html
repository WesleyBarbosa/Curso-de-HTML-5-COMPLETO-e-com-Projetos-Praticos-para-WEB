<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>tag th</title>
</head>
<body>

    <!-- Atributos:
        - colspan: Define o número de colunas que uma célula deve abranger.
        - rowspan: Define o número de linhas que uma célula deve abranger.
        - abbr: Define uma abreviação para uma célula.
        - scope: Define o escopo de uma célula de cabeçalho (linha, coluna, grupo de linhas ou grupo de colunas).
        - headers: Especifica quais células de cabeçalho estão associadas a uma célula de dados.
        - align: Alinha o conteúdo da célula (esquerda, centro, direita).
        - sorted: Define a ordem de classificação para a célula (ascendente ou descendente).
    -->

    <table>
        <thead>
            <tr>
                <th>Produto</th>
                <th>Preço</th>
                <th>Quantidade</th>
            </tr>
        </thead>
        <tbody>
            <tr>
                <td>Arroz</td>
                <td>R$ 20,00</td>
                <td>2 kg</td>
            </tr>
            <tr>
                <td>Feijão</td>
                <td>R$ 8,00</td>
                <td>1 kg</td>
            </tr>
            <tr>
                <td>Macarrão</td>
                <td>R$ 5,00</td>
                <td>500 g</td>
            </tr>
        </tbody>
    </table>

</body>
</html>
