<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tag rt</title>
</head>
<body>

    <!-- A tag rt é usada dentro da tag ruby para definir a anotação de pronúncia ou leitura de um caractere ou grupo de caracteres. -->

    <!-- Atributos: -->
    <!--
        Global attributes: class, id, style, title, etc.
        Non-standard attributes: data-*, aria-*
    -->

    <p>Exemplo de uso da tag rt dentro de uma tag ruby:</p>
    <ruby>
        漢 <rp>(</rp><rt>かん</rt><rp>)</rp>
        字 <rp>(</rp><rt>じ</rt><rp>)</rp>
    </ruby>
    <p>Neste exemplo, os elementos <code>&lt;rt&gt;</code> fornecem as leituras em hiragana para os caracteres kanji "漢字".</p>
    
</body>
</html>
