<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tag u</title>
</head>
<body>

        <!-- A tag u é usada para destacar o texto com uma linha sublinhada -->
        <!-- Atributos: -->
        <!--
            Global attributes: class, id, style, title, etc.
            Non-standard attributes: data-*, aria-*
        -->
        <p>Exemplo de uso da tag u:</p>
        <p>Este é um texto com <u>sublinhado</u> usando a tag <code>&lt;u&gt;</code>.</p>
        <p>Neste exemplo, a tag <code>&lt;u&gt;</code> é usada para aplicar um estilo de sublinhado ao texto, destacando-o visualmente no documento.</p>
    
</body>
</html>
