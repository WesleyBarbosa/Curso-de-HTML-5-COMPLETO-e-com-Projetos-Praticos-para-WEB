<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tag details</title>
</head>
<body>

    <!-- Tag details usada para exibir detalhes adicionais de um elemento -->

    <!-- Atributos: -->
    <!--
        Global attributes: class, id, style, title, etc.
        Non-standard attributes: data-*, aria-*
        open: indica se os detalhes estão visíveis por padrão
        ontoggle: indica o comportamento ao clicar no resumo
        Exemplo:
        <details open ontoggle="minhaFuncao()">
        -->
    -->

    <details id="detalhes">
        <summary>Detalhes</summary>
        <p>Este conteúdo é exibido apenas quando o usuário clica no resumo.</p>
    </details>
    <hr/>
    <details open id="detalhes">
        <summary>Detalhes</summary>
        <p>Este conteúdo é exibido apenas quando o usuário clica no resumo.</p>
    </details>

</body>
</html>
