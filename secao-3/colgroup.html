<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>tag colgroup</title>
</head>
<body>

    <!--Atributos:
        - span: Define o número de colunas que o grupo de colunas deve abranger.
        - align: Alinha o conteúdo do grupo de colunas (esquerda, centro, direita).
        - bgcolor: Define a cor de fundo do grupo de colunas.
    -->

    <table border="1">
        <colgroup>
            <col span="2" style="background-color: lightblue;">
            <col style="background-color: lightgreen;">
        </colgroup>
        <thead>
            <tr>
                <th>Nome</th>
                <th>Sobrenome</th>
                <th>Idade</th>
            </tr>
        </thead>
        <tbody>
            <tr>
                <td>João</td>
                <td>Silva</td>
                <td>28</td>
            </tr>
            <tr>
                <td>Maria</td>
                <td>Santos</td>
                <td>34</td>
            </tr>
            <tr>
                <td>Carlos</td>
                <td>Oliveira</td>
                <td>22</td>
            </tr>
        </tbody>
    
</body>
</html>
