<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tag q</title>
</head>
<body>

    <!-- A tag q é usada para definir uma citação curta dentro de um parágrafo -->
    <!-- A tag q é usada para destacar uma citação ou frase importante dentro de um parágrafo -->
    <!-- Atributos: -->
    <!--
        Global attributes: class, id, style, title, cite, etc.
        Non-standard attributes: data-*, aria-*
    -->
    
    <p>De acordo com a Wikipédia, <q cite="https://pt.wikipedia.org/wiki/HTML5">HTML5 (Hypertext Markup Language, versão 5) é uma linguagem de marcação para a World Wide Web e é uma tecnologia chave da Internet, originalmente proposto por Opera Software.</q></p>
    
</body>
</html>
