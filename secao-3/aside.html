<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tag aside</title>
</head>
<body>

    <!-- Tag aside usada para conteúdo relacionado, mas separado do conteúdo principal -->

    <!-- Atributos: -->
    <!--
        Global attributes: class, id, style, title, etc.
        Non-standard attributes: data-*, aria-*
    -->

    <aside id="notas-laterais">
        <h2>Notas Laterais</h2>
        <p>Este conteúdo adicional fornece informações complementares ao tema principal do documento.</p>
    </aside>
    
</body>
</html>
