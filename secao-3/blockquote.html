<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>tag blockquote</title>
</head>
<body>

    <!-- A tag blockquote é usada para exibir uma citação em um parágrafo -->
    <!-- A tag blockquote é usada para destacar uma citação ou frase importante em um parágrafo externo -->
    <!-- Atributos: -->
    <!--
        Global attributes: class, id, style, title, cite, etc.
        Non-standard attributes: data-*, aria-*
    -->
    
    <blockquote cite="https://pt.wikipedia.org/wiki/HTML5">
        HTML5 (Hypertext Markup Language, versão 5) é uma linguagem de marcação para a World Wide Web e é uma tecnologia chave da Internet, originalmente proposto por Opera Software.
    </blockquote>   
</body>
</html>
