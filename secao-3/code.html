<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tag code</title>
</head>
<body>

        <!-- A tag code é usada para definir um trecho de código de computador -->
        <!-- Atributos: -->
        <!--
            Global attributes: class, id, style, title, etc.
            Non-standard attributes: data-*, aria-*
        -->
        <p>Exemplo de uso da tag code:</p>
        <p>Para imprimir "Hello, World!" em Python, você pode usar o seguinte código: <code>print("Hello, World!")</code></p>
        <p>Neste exemplo, a tag <code>&lt;code&gt;</code> é usada para destacar o trecho de código Python dentro do parágrafo.</p>
    
</body>
</html>
