<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>tag header</title>
</head>
<body>

    <!-- Sobre a TAG HEADER -->
    <!-- 
        A tag header define o cabeçalho de uma seção ou documento HTML. 
        Pode conter elementos como títulos, logos, navegação e outros elementos que são relevantes para o cabeçalho da página.
        Exemplo:
        <header>
            <h1>Bem-vindo ao meu site</h1>
            <nav>
                <ul>
                    <li><a href="#home">Home</a></li>
                    <li><a href="#about">Sobre</a></li>
                    <li><a href="#contact">Contato</a></li>
                </ul>
            </nav>
        </header> 
     -->

    <header>
        <h1>Bem-vindo ao meu site</h1>
        <nav>
            <ul>
                <li><a href="#home">Home</a></li>
                <li><a href="#about">Sobre</a></li>
                <li><a href="#contact">Contato</a></li>
            </ul>
        </nav>
    </header> 

</body>
</html>
