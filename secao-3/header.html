<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>tag header</title>
</head>
<body>

    <!-- Sobre a TAG HEADER -->
    <!-- 
        A tag header define o cabeçalho de uma seção ou documento HTML. 
        Pode conter elementos como títulos, logos, navegação e outros elementos que são relevantes para o cabeçalho da página.
        Exemplo:
        <header>
            <h1>Bem-vindo ao meu site</h1>
            <nav>
                <ul>
                    <li><a href="#home">Home</a></li>
                    <li><a href="#about">Sobre</a></li>
                    <li><a href="#contact">Contato</a></li>
                </ul>
            </nav>
        </header> 
     -->

    <header>
        <img src="/img/logo1.png" alt="Logo" height="150px" title="Logo do site">
        <nav>
            <ul>
                <li><a href="#home">Home</a></li>
                <li><a href="#about">Sobre</a></li>
                <li><a href="#contact">Contato</a></li>
            </ul>
        </nav>
    </header> 

    <!-- Posso colocar uma tag header dentro de um article, section, etc -->
    
    <article>
        <header>
            <h1>Artigo 1</h1>
        </header>
        <p>Conteúdo do artigo 1</p>
    </article>

</body>
</html>
