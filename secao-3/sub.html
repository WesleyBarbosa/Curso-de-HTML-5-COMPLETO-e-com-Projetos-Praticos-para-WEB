<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tag sub</title>
</head>
<body>

    <!-- A tag sub é usada para destacar o texto subscrito em um documento -->
    <!-- Atributos: -->
    <!--
        Global attributes: class, id, style, title, etc.
        Non-standard attributes: data-*, aria-*
    -->
    <p>Exemplo de uso da tag sub:</p>
    <p>O símbolo químico da água é H<sub>2</sub>O.</p>
    <p>Neste exemplo, o número "2" é exibido em subscrito, indicando que há dois átomos de hidrogênio na molécula de água.</p>
    
</body>
</html>
