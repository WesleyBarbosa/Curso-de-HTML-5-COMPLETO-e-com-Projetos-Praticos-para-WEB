<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tag em</title>
</head>
<body>

    <!-- A tag em é usada para destacar palavras ou frases importantes em um parágrafo -->
    <!-- Antes de usar a tag em, considere usar a tag <strong>, <mark>, <b> ou <h1> até <h6> para destacar o texto -->
    <!-- Atributos: -->
    <!--
        Global attributes: class, id, style, title, etc.
        Non-standard attributes: data-*, aria-*
    -->

    <h1>Exemplo da tag em</h1>

    <p>Este é um exemplo de texto com ênfase usando a tag <em>em</em>.</p>

    <p>Você pode usar a tag <em>em</em> para destacar palavras ou frases importantes em um parágrafo.</p>
    
</body>
</html>
