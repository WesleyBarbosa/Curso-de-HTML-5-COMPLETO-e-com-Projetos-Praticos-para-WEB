<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>tag main</title>
</head>
<body>
    <!--
    A tag main define o conteúdo principal do documento HTML.
    Ela deve ser usada apenas uma vez por página e deve conter o conteúdo central da página.
    -->

    <header>
        <p>Cabeçalho da página</p>
    </header>

    <main>
        <h1>Conteúdo Principal da Página</h1>
        <p>Este é o conteúdo principal do documento HTML. A tag &lt;main&gt; é usada para envolver o conteúdo que é diretamente relacionado ao tema central da página.</p>
    </main>
    
    <footer>
        <p>Rodapé da página</p>
    </footer>
</body>
</html>
