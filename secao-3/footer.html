<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>tag footer</title>
</head>
<body>

    <!-- Sobre a TAG FOOTER -->
    <!-- 
        A tag footer define o rodapé de uma seção ou documento HTML.
        Pode conter elementos como informações de copyright, links para páginas relacionadas e outros elementos relevantes para o rodapé da página.
        Exemplo:
        <footer>
            <p>&copy; 2023 Meu Site. Todos os direitos reservados.</p>
            <nav>
                <ul>
                    <li><a href="#privacy">Política de Privacidade</a></li>
                    <li><a href="#terms">Termos de Uso</a></li>
                </ul>
            </nav>
        </footer> 
     -->
    <header>
        <p>Cabeçalho da página</p>
    </header>

    <main>
        <h1>Conteúdo Principal da Página</h1>
    </main>

    <footer>
        <p>&copy; 2026 Meu Site. Todos os direitos reservados.</p>
        <nav>
            <ul>
                <li><a href="#privacy">Política de Privacidade</a></li>
                <li><a href="#terms">Termos de Uso</a></li>
            </ul>
        </nav>
    </footer>

</body>
</html>
