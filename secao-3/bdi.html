<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tag bdi</title>
</head>
<body>

    <!-- A tag bdi é usada para isolar uma parte do texto que pode ser exibida em uma direção diferente do texto ao redor -->
    <!-- A tag bdi é útil para exibir texto em idiomas com direções diferentes, como árabe ou hebraico, dentro de um texto em português -->
    <!-- Atributos: -->
    <!--
        Global attributes: class, id, style, title, etc.
        Non-standard attributes: data-*, aria-*
    -->

    <p>Este é um exemplo de uso da tag <bdi>bdi</b> para isolar texto com direção diferente:</p>
    <p>O nome do usuário é <bdi dir="rtl">محمد</bdi> e ele está logado no sistema.</p>
    <p>Outro exemplo: A palavra <bdi dir="ltr">hello</bdi> significa "olá" em inglês.</p>
    <p>Exemplo de uso da tag <bdi>bdi</b> em uma frase: O nome do usuário <bdi dir="rtl">محمد</bdi> e ele está logado no sistema.</p>
    <!-- paragrafo com texto em direcao diferente -->
    <p dir="rtl">محمد</p>
    
</body>
</html>
