<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tag i</title>
</head>
<body>

    <!-- A tag i é usada para representar um texto em itálico, geralmente para destacar termos técnicos, estrangeirismos ou pensamentos. -->

    <!-- Antes de usar a tag i, considere usar a tag <em>, <strong>, <cite>, dfn, <mark>, <b> ou <h1> até <h6> para destacar o texto -->

    <!-- Atributos: -->
    <!--
        Global attributes: class, id, style, title, etc.
        Non-standard attributes: data-*, aria-*
    -->

    <p>Este é um texto normal e este é um texto em <i>itálico</i>.</p>
    
</body>
</html>
