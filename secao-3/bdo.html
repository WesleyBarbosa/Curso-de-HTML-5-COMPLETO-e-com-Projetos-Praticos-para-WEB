<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tag bdo</title>
</head>
<body>

    <!-- A tag bdo é usada para substituir a direção do texto -->
    <!-- Atributos: -->
    <!--
        Global attributes: class, id, style, title, etc.
        Non-standard attributes: data-*, aria-*
        dir: Define a direção do texto (ltr - left to right, rtl - right to left)
    -->

    <p>Texto normal em português.</p>
    <p>Texto com direção da direita para a esquerda: <bdo dir="rtl">!odnum álO</bdo></p>
    <p>Texto com direção da esquerda para a direita: <bdo dir="ltr">This text is written from left to right.</bdo></p>
    
</body>
</html>
