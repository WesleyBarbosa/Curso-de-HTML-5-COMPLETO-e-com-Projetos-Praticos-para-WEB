<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tag s</title>
</head>
<body>

    <!-- A tag s é usada para indicar que o texto contido nela foi riscado ou marcado como incorreto, obsoleto ou não mais relevante. -->

    <!-- Atributos: -->
    <!--
        Global attributes: class, id, style, title, etc.
        Non-standard attributes: data-*, aria-*
    -->

    <p>Exemplo de uso da tag s:</p>
    <p>Este é um texto <s>riscado</s> para indicar que está incorreto.</p>
    <p>Neste exemplo, o texto dentro da tag <code>&lt;s&gt;</code> aparece com uma linha atravessada, sugerindo que ele não é mais válido ou relevante.</p>
    
</body>
</html>
