<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tag address</title>
</head>
<body>

    <!-- Tag address usada para definir o endereço de contato de um documento ou seção -->
    <!-- Atributos: -->
    <!--
        Global attributes: class, id, style, title, etc.
        Non-standard attributes: data-*, aria-*
    -->

    <address id="endereco-contato">
        <p>Endereço: Rua Exemplo, 123 - São Paulo/SP</p>
        <p>Telefone: (11) 1234-5678</p>
        <p>Email: contato@exemplo.com</p>
    </address>

</body>
</html>
