<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tag data</title>
</head>
<body>

    <!-- A tag data é usada para definir um valor numérico ou uma data -->
    <!-- A tag data é usada para representar um valor numérico ou uma data -->
    <!-- Atributos: -->
    <!--
        Global attributes: class, id, style, title, etc.
        Non-standard attributes: data-*, aria-*
    -->

    <p>O preço do produto é <data value="29.99">R$ 29,99</data>.</p>
    <p>A data de nascimento do cliente é <data value="1985-06-15">15 de junho de 1985</data>.</p>

</body>
</html>
