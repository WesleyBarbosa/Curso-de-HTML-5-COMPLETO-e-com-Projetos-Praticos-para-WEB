<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>tag table</title>
    <link rel="stylesheet" href="/css/table.css">
</head>
<body>

    <table>
        <thead>
            <tr>
                <th>Coluna 1</th>
                <th>Coluna 2</th>
                <th>Coluna 3</th>
            </tr>
        </thead>
        <tbody>
            <tr>
                <td>Conteúdo da célula 1</td>
                <td>Conteúdo da célula 2</td>
                <td>Conteúdo da célula 3</td>
            </tr>
        </tbody>
    </table>

</body>
</html>
