<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tag dfn</title>
</head>
<body>

    <!-- A tag dfn é usada para definir um termo que está sendo definido dentro de um texto -->
    <!-- A tag dfn é usada para destacar o termo que está sendo definido -->
    <!-- Atributos: -->
    <!--
        Global attributes: class, id, style, title, etc.
        Non-standard attributes: data-*, aria-*
    -->

    <p>HTML é a sigla para <dfn title="HyperText Markup Language">Linguagem de Marcação de Hipertexto</dfn>, que é a linguagem padrão usada para criar páginas da web.</p>
    
</body>
</html>
