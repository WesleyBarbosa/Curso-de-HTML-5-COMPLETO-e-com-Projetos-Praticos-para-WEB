<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tag kbd</title>
</head>
<body>

    <!-- A tag kbd é usada para representar a entrada do teclado, ou seja, o texto que o usuário deve digitar ou pressionar. -->

    <!-- Atributos: -->
    <!--
        Global attributes: class, id, style, title, etc.
        Non-standard attributes: data-*, aria-*
    -->

    <p>Para salvar o documento, pressione <kbd>Ctrl</kbd> + <kbd>S</kbd>.</p>

    <p>Para abrir uma nova aba, pressione <kbd>Ctrl</kbd> + <kbd>N</kbd>.</p>
    
</body>
</html>
