<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>tag col</title>
</head>

<body>

    <!--Atributos:
        - span: Define o número de colunas que a célula deve abranger.
        - align: Alinha o conteúdo da célula (esquerda, centro, direita).
        - bgcolor: Define a cor de fundo da célula.
    -->

    <table border="1">
        <colgroup span="3">
            <col style="background-color: lightcoral;">
            <col style="background-color: lightseagreen;">
            <col style="background-color: lightgoldenrodyellow;">
        </colgroup>
        <thead>
            <tr>
                <th>País</th>
                <th>Capital</th>
                <th>População</th>
            </tr>
        </thead>
        <tbody>
            <tr>
                <td>Brasil</td>
                <td>Brasília</td>
                <td>211 milhões</td>
            </tr>
            <tr>
                <td>Argentina</td>
                <td>Buenos Aires</td>
                <td>45 milhões</td>
            </tr>
            <tr>
                <td>Chile</td>
                <td>Santiago</td>
                <td>19 milhões</td>
            </tr>
        </tbody>
    </table>
</body>

</html>
