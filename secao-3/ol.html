<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tag ol</title>
</head>
<body>

    <!-- Tag ol usada para criar listas ordenadas -->

    <!-- Atributos: -->
    <!--
        Global attributes: class, id, style, title, etc.
        Non-standard attributes: data-*, aria-*
        type (obsoleto): Define o estilo da numeração (1, A, a, I, i)
        start: Define o número inicial da lista
        reversed: Inverte a ordem da numeração
    -->

    <h2>Exemplo de lista ordenada</h2>
    <ol>
        <li>Item 1</li>
        <li>Item 2
            <ol>
                <li>Subitem 2.1</li>
                <li>Subitem 2.2</li>
            </ol>
        </li>
        <li>Item 3</li>
    </ol>
    
</body>
</html>
