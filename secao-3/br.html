<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tag br</title>
</head>
<body>

    <!-- A tag br é usada para inserir uma quebra de linha em um texto -->
    <!-- A tag br é usada para separar linhas de texto sem iniciar um novo parágrafo -->
    <!-- Atributos: -->
    <!--
        Global attributes: class, id, style, title, etc.
        Non-standard attributes: data-*, aria-*
    -->
    
    <p>Esta é a primeira linha.<br>Esta é a segunda linha após a quebra de linha.<br>Esta é a terceira linha após outra quebra de linha.</p>
    
</body>
</html>
