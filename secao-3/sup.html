<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tag sup</title>
</head>
<body>

    <!-- A tag sup é usada para destacar o texto sobrescrito em um documento -->
    <!-- Atributos: -->
    <!--
        Global attributes: class, id, style, title, etc.
        Non-standard attributes: data-*, aria-*
    -->
    <p>Exemplo de uso da tag sup:</p>
    <p>A fórmula matemática para a área de um círculo é A = πr<sup>2</sup>.</p>
    <p>Neste exemplo, o número "2" é exibido em sobrescrito, indicando que o raio (r) deve ser elevado ao quadrado na fórmula.</p>
    
</body>
</html>
