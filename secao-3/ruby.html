<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tag ruby</title>
</head>
<body>

    <!-- A tag ruby é usada para exibir anotações fonéticas ou de pronúncia para caracteres, geralmente em idiomas como o japonês ou chinês. -->

    <!-- Atributos: -->
    <!--
        Global attributes: class, id, style, title, etc.
        Non-standard attributes: data-*, aria-*
    -->

    <p>Exemplo de uso da tag ruby:</p>
    <ruby>
        漢 <rp>(</rp><rt>かん</rt><rp>)</rp>
        字 <rp>(</rp><rt>じ</rt><rp>)</rp>
    </ruby>
    <p>Neste exemplo, os caracteres kanji "漢字" são anotados com suas respectivas leituras em hiragana "かん" e "じ".</p>
    
</body>
</html>
