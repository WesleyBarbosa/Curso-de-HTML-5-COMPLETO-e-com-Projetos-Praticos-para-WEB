<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tag rp</title>
</head>
<body>

    <!-- A tag rp é usada em conjunto com a tag ruby para fornecer suporte a navegadores que não suportam a renderização de anotações ruby. Ela envolve os caracteres que aparecem antes e depois da anotação ruby. -->

    <!-- Atributos: -->
    <!--
        Global attributes: class, id, style, title, etc.
        Non-standard attributes: data-*, aria-*
    -->

    <p>Exemplo de uso da tag rp dentro de uma tag ruby:</p>
    <ruby>
        漢 <rp>(</rp><rt>かん</rt><rp>)</rp>
        字 <rp>(</rp><rt>じ</rt><rp>)</rp>
    </ruby>
    <p>Neste exemplo, os elementos <code>&lt;rp&gt;</code> fornecem parênteses ao redor das anotações ruby para navegadores que não suportam a tag ruby.</p>
    
</body>
</html>
