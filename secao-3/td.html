<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>tag td</title>
    <link rel="stylesheet" href="/css/table.css">
</head>
<body>

    <table>
        <tr>
            <td colspan="2">Celula 1</td>
            <td>Celula 3</td>
        </tr>
        <tr>
            <td>Celula 4</td>
            <td rowspan="2">Celula 5</td>
            <td>Celula 6</td>
        </tr>
        <tr>
            <td>Celula 7</td>
            <td>Celula 8</td>
        </tr>
    </table>
    
</body>
</html>
